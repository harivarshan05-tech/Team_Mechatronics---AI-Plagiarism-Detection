version: '3.8'

services:
  plagiarism-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritascode-detector
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
